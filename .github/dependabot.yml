# =====================================================================
# Dependabot — weekly version updates, batched into grouped PRs.
#
# Commit messages use the "chore(deps)" prefix so PRs pass
# commitlint.yml (Conventional Commits, header <= 72 chars — Dependabot
# usually stays under it; if a header ever exceeds 72, rebase-squash
# the branch to rewrite it).
#
# `labels:` must exist in .github/labels.yml (run label-sync.yml first).
# =====================================================================
version: 2

updates:
  # GitHub Actions — keeps the workflow action pins fresh.
  # Note: SHA-pinned actions (e.g. actions/labeler) are updated by
  # Dependabot too — it rewrites the SHA and the # vX.Y.Z comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "area:ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # Python deps via uv (pyproject.toml + uv.lock stay in sync).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        # Spark/Delta major bumps touch code, not just the lockfile —
        # keep those as individual, reviewable PRs.
        exclude-patterns:
          - "pyspark"
          - "delta-spark"
