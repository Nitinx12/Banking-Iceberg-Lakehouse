# =====================================================================
# .github/labeler.yml — path-based PR labels (actions/labeler v5)
# Map: one area label per real top-level dir in this repo.
# Every label here MUST exist in .github/labels.yml (labeler does not
# create labels) — keep both files in sync.
# =====================================================================

"area:bronze":
  - changed-files:
      - any-glob-to-any-file: ["notebooks/bronze/**"]

"area:silver":
  - changed-files:
      - any-glob-to-any-file: ["notebooks/silver/**"]

"area:gold":
  - changed-files:
      - any-glob-to-any-file: ["notebooks/gold/**"]

"area:core":
  - changed-files:
      - any-glob-to-any-file: ["src/core/**"]

"area:pipeline":
  - changed-files:
      - any-glob-to-any-file:
          ["src/jobs/**", "src/utils/**", "src/config.py", "main.py"]

"area:data-quality":
  - changed-files:
      - any-glob-to-any-file: ["gx/**"]

"area:data-generator":
  - changed-files:
      - any-glob-to-any-file: ["generator/**"]

"area:databricks":
  - changed-files:
      - any-glob-to-any-file: ["sql/**", "docs/cluster.md"]

"area:tests":
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          [
            ".github/**",
            ".githooks/**",
            ".claude/**",
            "Makefile",
            ".pre-commit-config.yaml",
            ".commitlintrc.json",
            ".editorconfig",
            ".gitattributes",
          ]

"documentation":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]

"dependencies":
  - changed-files:
      - any-glob-to-any-file: ["pyproject.toml", "uv.lock"]
