# =====================================================================
# .github/labels.yml — canonical label taxonomy (source of truth)
# Reconciled against GitHub by .github/workflows/label-sync.yml on
# every change to this file. Label-sync creates/updates but does NOT
# delete (skip-delete) so manually created labels survive.
#
# Every label referenced in .github/labeler.yml must appear here.
# =====================================================================

# --- Medallion layers (colors match the layer) ---
- name: "area:bronze"
  color: "cd7f32" # bronze
  description: "Bronze layer — raw ingest (Auto Loader, Delta, mergeSchema)"
- name: "area:silver"
  color: "c0c0c0" # silver
  description: "Silver layer — clean, dedupe, SCD2, quality gate + quarantine"
- name: "area:gold"
  color: "ffd700" # gold
  description: "Gold layer — DAU/WAU, watch time by genre, churn, MRR"

# --- Code areas ---
- name: "area:core"
  color: "1d76db"
  description: "src/core — SCD2, transformations, quality checks, IO utils"
- name: "area:pipeline"
  color: "0e8a16"
  description: "src/jobs, src/utils, src/config, main.py — orchestration entrypoints"
- name: "area:data-quality"
  color: "5319e7"
  description: "gx/ — Great Expectations suites and validation runner"
- name: "area:data-generator"
  color: "b60205"
  description: "data_generator/ — synthetic landing data (Faker)"
- name: "area:databricks"
  color: "ff361f"
  description: "Databricks-specific — sql/init_schema.sql, Unity Catalog, cluster docs"
- name: "area:tests"
  color: "006b75"
  description: "tests/ — pytest suite (SCD2 idempotency, dedup, quality gate, GX)"
- name: "area:ci"
  color: "e99695"
  description: "CI/CD & tooling — workflows, git hooks, pre-commit, Makefile, .claude"

# --- Cross-cutting ---
- name: "documentation"
  color: "0075ca"
  description: "docs/, README, and other markdown"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency changes — pyproject.toml, uv.lock"

# --- Standard GitHub defaults (kept so the taxonomy is complete) ---
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
