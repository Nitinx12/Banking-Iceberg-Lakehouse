name: CD
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
  id-token: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: airflow/Dockerfile
          push: false
          tags: banking-lakehouse:${{ github.sha }}
  deploy-dev:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials via OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: 1.9.0 }
      - name: Terraform apply dev
        if: env.AWS_ROLE_ARN != ''
        working-directory: terraform/envs/dev
        run: |
          terraform init -backend-config=backend.hcl -reconfigure -input=false
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
      - name: Deploy DAGs and jobs
        if: env.AWS_ROLE_ARN != ''
        run: |
          aws s3 sync airflow/dags "s3://banking-lakehouse-dev/dev/airflow/dags" --delete
          aws s3 sync jobs "s3://banking-lakehouse-dev/dev/airflow/jobs" --delete
      - name: Skipped — cloud credentials not configured
        if: env.AWS_ROLE_ARN == ''
        run: |
          echo "Skipping deploy: AWS_DEPLOY_ROLE_ARN not set for the dev environment."
          echo "Per Architecture 17.2 this job promotes main to dev once OIDC access is configured."
  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials via OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: 1.9.0 }
      - name: Terraform apply staging
        if: env.AWS_ROLE_ARN != ''
        working-directory: terraform/envs/staging
        run: |
          terraform init -reconfigure -input=false
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
      - name: Smoke tests
        if: env.AWS_ROLE_ARN != ''
        run: echo "smoke tests (pipeline health probe) run here before prod promotion"
      - name: Skipped — cloud credentials not configured
        if: env.AWS_ROLE_ARN == ''
        run: echo "Skipping staging deploy — AWS_DEPLOY_ROLE_ARN not set for the staging environment."
  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://banking.example.com
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials via OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: 1.9.0 }
      - name: Terraform apply prod
        if: env.AWS_ROLE_ARN != ''
        working-directory: terraform/envs/prod
        run: |
          terraform init -reconfigure -input=false
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
      - name: Skipped — cloud credentials not configured
        if: env.AWS_ROLE_ARN == ''
        run: |
          echo "Skipping prod deploy: AWS_DEPLOY_ROLE_ARN not set for the prod environment."
          echo "Prod requires the environment protection rule approval (Architecture 17.2)."
