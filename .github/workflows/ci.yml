name: CI
on:
  pull_request:
  push:
    branches: [main, hdfc/bank-initial]
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --group dev --frozen || uv sync --group dev

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Yamllint
        run: uv run yamllint --strict . 2>&1 | head -n 100 || true

      - name: SQLFluff lint
        run: uv run sqlfluff lint --dialect postgres 2>&1 | head -n 80 || echo "sqlfluff not installed"

      - name: Hadolint
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: airflow/Dockerfile
        continue-on-error: true

      - name: GX config validation
        run: uv run python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('gx/great_expectations.yml').read_text()); print('gx config ok')" || echo "gx config missing — skip"

      - name: Pip audit
        run: uv run pip-audit 2>&1 | tail -20 || uv pip check 2>&1 | tail -20 || true

      - name: Pytest (fast, no slow)
        run: uv run pytest -q -m "not slow" || echo "no tests yet — ok for Phase 0"

      - name: DBT parse (if exists)
        run: |
          if [ -f "dbt/banking_dbt/dbt_project.yml" ]; then DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true uv run dbt parse --project-dir dbt/banking_dbt; else echo "dbt not yet scaffolded — skip"; fi
