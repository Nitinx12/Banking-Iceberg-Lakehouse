name: CI
on:
  pull_request:
  push:
    branches: [main, hdfc/bank-initial]
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3.8.0
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --group dev --frozen || uv sync --group dev

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Yamllint
        run: uv run yamllint -d relaxed . 2>&1 | head -n 200

      - name: SQLFluff lint
        run: uv run sqlfluff lint --dialect postgres dbt/banking_dbt/models --exclude-rules L003,L009,L010 2>&1 | head -n 120

      - name: Hadolint
        uses: hadolint/hadolint-action@4b5806eb9c6bee4954fc0e0cc3ad6175fc9782c1 # v3.1.0
        with:
          dockerfile: airflow/Dockerfile

      - name: GX config validation
        run: uv run python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('gx/great_expectations.yml').read_text()); print('gx config ok')" || echo "gx config missing — skip"

      - name: Pip audit
        run: uv run pip-audit 2>&1 | tail -30

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # 0.24.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table

      - name: PII guard — raw email/phone must not reach serving
        run: |
          if grep -R "json_extract_scalar.*email')" dbt/banking_dbt/models/silver --include="*.sql" 2>/dev/null | grep -v sha256; then
            echo "[FAIL] raw email in Silver model — must be sha256/hmac"; exit 1; fi
          if grep -q "pii" dbt/banking_dbt/models/silver/schema.yml 2>/dev/null; then echo "pii tag present"; else echo "[FAIL] missing pii tag"; exit 1; fi

      - name: Pytest (fast, no slow)
        run: uv run pytest -q -m "not slow"

      - name: DBT parse (if exists)
        run: |
          if [ -f "dbt/banking_dbt/dbt_project.yml" ]; then DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true uv run dbt parse --project-dir dbt/banking_dbt; else echo "dbt not yet scaffolded — skip"; fi
