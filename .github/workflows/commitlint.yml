# =====================================================================
# Commitlint — CI parity with .githooks/commit-msg
# Lints every commit message in a PR against .commitlintrc.json
# (Conventional Commits, subject <= 72 chars)
# =====================================================================
name: Commitlint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the action can diff base..head

      - uses: wagoid/commitlint-github-action@v6
