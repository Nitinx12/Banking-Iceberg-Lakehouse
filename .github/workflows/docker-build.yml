name: Docker Build
# Builds every image on PRs touching them (push=false — registry push belongs to cd.yml)
on:
  pull_request:
    paths:
      - "docker/**"
      - "airflow/Dockerfile"
      - "docker-compose.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: airflow
            context: .
            dockerfile: airflow/Dockerfile
          - name: airflow-alt
            context: .
            dockerfile: docker/Dockerfile.airflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: hadolint/hadolint-action@4b5806eb9c6bee4954fc0e0cc3ad6175fc9782c1 # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
        continue-on-error: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: banking-lakehouse/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
