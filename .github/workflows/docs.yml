name: Docs
on:
  push: { branches: [main] }
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3.8.0
        with: { enable-cache: true }
      - run: uv sync --group dev || true
      - name: Generate dbt docs
        run: |
          if [ -f "dbt/banking_dbt/dbt_project.yml" ]; then
            DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true uv run dbt docs generate --project-dir dbt/banking_dbt --target-path docs_site 2>&1 | tail -20 || true
          fi
      - name: Assemble docs site
        run: |
          mkdir -p public/dq_docs
          if [ -d "dbt/banking_dbt/docs_site" ]; then cp -r dbt/banking_dbt/docs_site/* public/; fi
          # GX Data Docs land here when Phase 3 checkpoints write to gx/uncommitted/data_docs
          if [ -d "gx/uncommitted/data_docs" ]; then cp -r gx/uncommitted/data_docs/* public/dq_docs/; fi
          if [ ! -f public/index.html ]; then
            echo "<!doctype html><title>HDFC Banking Data Platform Docs</title><h1>Docs pending first dbt docs generate</h1>" > public/index.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
