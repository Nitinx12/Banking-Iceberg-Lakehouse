# =====================================================================
# Label Sync — reconcile GitHub's labels with .github/labels.yml
#
# Runs when the canonical taxonomy file changes on main (or manually).
# Deliberately uses only first-party actions + the preinstalled gh CLI
# and yq: no third-party action to vet/pin, and the sync logic is a
# plain, auditable loop instead of an opaque action.
#
# Creates/updates labels only — never deletes (manually created labels
# survive). Deleting is a one-liner (`gh label delete`) if ever wanted.
# =====================================================================
name: Label Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: label-sync
  cancel-in-progress: false  # avoid two runs mutating labels at once

jobs:
  sync:
    name: Sync labels from .github/labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Upsert labels via gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(yq 'length' .github/labels.yml)
          echo "Syncing ${count} labels to ${GITHUB_REPOSITORY}"
          i=0
          while [ "$i" -lt "$count" ]; do
            name=$(yq ".[$i].name" .github/labels.yml)
            color=$(yq ".[$i].color" .github/labels.yml)
            desc=$(yq ".[$i].description" .github/labels.yml)
            # --force makes create an upsert: creates missing, updates existing
            gh label create "$name" \
              --repo "$GITHUB_REPOSITORY" \
              --color "$color" \
              --description "$desc" \
              --force
            i=$((i + 1))
          done
          echo "--- Labels now on repo ---"
          gh label list --repo "$GITHUB_REPOSITORY" --limit 100
