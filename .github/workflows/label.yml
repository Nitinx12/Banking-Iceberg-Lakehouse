# =====================================================================
# Label PRs — path-based labels from .github/labeler.yml
#
# Trigger choice (pull_request_target vs pull_request):
#   pull_request_target is used so fork PRs also get labeled — the
#   workflow runs against the BASE branch with a write token, whereas
#   plain pull_request would leave fork PRs unlabeled (fork PRs get a
#   read-only token). The classic pull_request_target risk is checking
#   out / executing untrusted PR code; actions/labeler never checks out
#   the PR — it reads the PR's changed files via the API — so there is
#   no checkout step in this workflow on purpose. Do NOT add one.
#
# This workflow is advisory: it must never be a required status check.
# =====================================================================
name: Label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# Least-privilege — labeler only needs to read the PR and write labels.
permissions:
  contents: read
  pull-requests: write

# Re-pushes to the same PR cancel the now-stale labeling run.
concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply path-based labels
        # Pinned to full commit SHA so a compromised tag can't change behavior.
        # SHA corresponds to actions/labeler v5.0.0 — verify/refresh with:
        #   gh api repos/actions/labeler/git/ref/tags/v5.0.0 --jq .object.sha
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          # sync-labels also REMOVES matching labels when paths no longer
          # match — i.e. manually added area labels on a PR may be removed
          # on the next push. That is the desired single-source behavior.
          sync-labels: true
