name: Lint
# Complements ci.yml (the PR gate): keeps main honest after merges, without re-running the PR suite.
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.yml"
      - "**.yaml"
      - "**.sql"
      - ".githooks/**"
      - "Makefile"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3.8.0
        with: { enable-cache: true }
      - run: uv sync --group dev --frozen || uv sync --group dev
      - name: Ruff check + format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Yamllint
        run: uv run yamllint -d relaxed . 2>&1 | head -n 200
      - name: SQLFluff
        run: uv run sqlfluff lint --dialect postgres dbt/banking_dbt/models --exclude-rules L003,L009,L010 2>&1 | head -n 120
      - name: Shellcheck (scripts + hooks)
        run: |
          find scripts/sh .githooks -type f | xargs shellcheck -x 2>&1 | head -n 100
