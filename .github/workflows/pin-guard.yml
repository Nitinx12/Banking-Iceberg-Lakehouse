name: Pin Guard
# Architecture 14.5 — GitHub Actions must be pinned to commit SHA, not floating tags.
# Enforced: any floating @vX fails the PR. Dependabot proposes SHA updates weekly.
on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**"]
permissions: { contents: read }
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Check that third-party actions are SHA-pinned (enforced)
        shell: bash
        run: |
          echo "Checking for floating tags (uses: foo@vX) without SHA pin..."
          offenders=$(grep -R "uses:" .github/workflows --include="*.yml" | grep -E "uses:.*@[0-9a-f]{40}" -v | grep -E "uses:.*@v[0-9]" || true)
          # ignore the echo line that mentions @v4 as example
          offenders=$(echo "$offenders" | grep -v "echo \"Fix:" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Floating tags found — must be SHA-pinned:"
            echo "$offenders"
            exit 1
          fi
          echo "All actions are SHA-pinned."
