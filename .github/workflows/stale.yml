name: Stale
# Housekeeping: flag dormant issues/PRs, close after a grace period. Never touches code.
on:
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-message: >
            This issue has been inactive for 30 days. It will close in 14 days if
            there is no further activity — comment to keep it open. Check PROJECT_PLAN.md
            for the current phase before reviving scope discussions.
          stale-pr-message: >
            This pull request has been inactive for 30 days. Rebase against main and
            re-run CI to keep it open — small, short-lived branches per AGENTS.md §12.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: [pinned, blocked, good-first-issue]
          exempt-pr-labels: [pinned, blocked, work-in-progress]
          operations-per-run: 60
