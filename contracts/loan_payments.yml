collection: loan_payments
business_key: payment_id
watermark_field: created_at
schema_version: "1.0"
mode: incremental
count_expected: 600000
fields:
  - name: _id
    type: string
    required: true
  - name: payment_id
    type: int
    required: true
  - name: loan_id
    type: int
    required: true
  - name: payment_date
    type: date
    required: true
  - name: amount_paid
    type: decimal(18,2)
    required: true
  - name: principal_component
    type: decimal(18,2)
    required: true
  - name: interest_component
    type: decimal(18,2)
    required: true
  - name: late_payment_flag
    type: int
    required: false
  - name: created_at
    type: timestamp
    required: true

drift_policy:
  new_field: warn
  removed_required_field: fail
  type_change: fail
