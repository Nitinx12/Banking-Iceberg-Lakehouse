collection: loans
business_key: loan_id
watermark_field: created_at
schema_version: "1.0"
mode: incremental
count_expected: 22000
fields:
  - name: _id
    type: string
    required: true
  - name: loan_id
    type: int
    required: true
  - name: customer_id
    type: int
    required: true
  - name: branch_id
    type: int
    required: true
  - name: loan_type
    type: string
    required: true
  - name: loan_amount
    type: decimal(18,2)
    required: true
  - name: interest_rate
    type: double
    required: true
  - name: term_months
    type: int
    required: true
  - name: start_date
    type: date
    required: true
  - name: status
    type: string
    required: true
  - name: created_at
    type: timestamp
    required: true

drift_policy:
  new_field: warn
  removed_required_field: fail
  type_change: fail
