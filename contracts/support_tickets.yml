collection: support_tickets
business_key: ticket_id
watermark_field: created_at
schema_version: "1.0"
mode: incremental
count_expected: 25000
fields:
  - name: _id
    type: string
    required: true
  - name: ticket_id
    type: int
    required: true
  - name: customer_id
    type: int
    required: true
  - name: issue_type
    type: string
    required: true
  - name: date_opened
    type: date
    required: true
  - name: date_resolved
    type: date
    required: false
  - name: status
    type: string
    required: true
  - name: satisfaction_score
    type: int
    required: false
  - name: created_at
    type: timestamp
    required: true

drift_policy:
  new_field: warn
  removed_required_field: fail
  type_change: fail
