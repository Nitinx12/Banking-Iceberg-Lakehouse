name: banking_dbt
version: "1.0"
config-version: 2
profile: banking_dbt
# CE path: Iceberg-everywhere via JDBC catalog `banking` (ADR 003 amended 2026-09-21). Silver/Gold USING iceberg proven on CE;
# Delta fallback (`type: delta` + UniForm) only for paid Databricks Unity Catalog if needed.
# Swap `type: databricks` to local `type: postgres` or `duckdb` for pure local dev if needed.

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

require-dbt-version: ">=1.8.0"

models:
  banking_dbt:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: incremental
      +incremental_strategy: merge
      +schema: silver
      +on_schema_change: append_new_columns
      +contract:
          enforced: false
    gold:
      +materialized: incremental
      +incremental_strategy: merge
      +schema: gold
      +on_schema_change: append_new_columns
      +contract:
          enforced: true

seeds:
  banking_dbt:
    +schema: silver
    +column_types:
        code: varchar(10)

snapshots:
  banking_dbt:
    +target_schema: silver
    +strategy: check
    +check_cols: all
    +invalidate_hard_deletes: true
