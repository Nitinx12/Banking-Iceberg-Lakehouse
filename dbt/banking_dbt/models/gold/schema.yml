version: 2
models:
  - name: dim_customer
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_account
    columns:
      - name: account_sk
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
  - name: fct_transactions
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: amount
        tests: [not_null]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
  - name: fct_card_transactions
    columns:
      - name: card_txn_id
        tests: [not_null, unique]
