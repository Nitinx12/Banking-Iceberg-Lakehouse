version: 2
models:
  - name: silver_customers
    config:
      tags: ["silver"]
    columns:
      - name: email_hmac
        description: PII — HMAC-SHA256 of email using PII_HMAC_SECRET+salt (jobs/transform/silver_customers.py:44). Raw email never persists. [pii:confidential]
        tests: [not_null]
      - name: phone_hmac
        description: PII — HMAC-SHA256 of phone using PII_HMAC_SECRET+salt. Raw phone never persists. [pii:confidential]
      - name: customer_id
        tests: [not_null, unique]
      - name: name
        description: PII — confidential [pii:confidential]
  - name: silver_accounts
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: silver_transactions
    columns:
      - name: transaction_id
        tests: [not_null]
