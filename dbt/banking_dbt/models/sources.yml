version: 2

sources:
  - name: bronze
    database: "{{ env_var('ICEBERG_CATALOG_NAME', 'banking') }}"
    schema: bronze
    config:
      # Freshness per Architecture 7.2 / 13.2 — daily batch cadence, evaluated on _ingested_at
      freshness:
        warn_after: { count: 25, period: hour }
        error_after: { count: 26, period: hour }
    tables:
      - name: customers
        config:
          loaded_at_field: _ingested_at
        columns:
          - name: _id
            tests: [not_null]
      - name: accounts
        config:
          loaded_at_field: _ingested_at
        columns:
          - name: _id
            tests: [not_null]
      - name: transactions
        config:
          loaded_at_field: _ingested_at
        columns:
          - name: _id
            tests: [not_null]
      - name: branches
        config:
          loaded_at_field: _ingested_at
      - name: loans
        config:
          loaded_at_field: _ingested_at
      - name: cards
        config:
          loaded_at_field: _ingested_at
      - name: card_transactions
        config:
          loaded_at_field: _ingested_at
      - name: loan_payments
        config:
          loaded_at_field: _ingested_at
      - name: support_tickets
        config:
          loaded_at_field: _ingested_at
      - name: employees
        config:
          loaded_at_field: _ingested_at
