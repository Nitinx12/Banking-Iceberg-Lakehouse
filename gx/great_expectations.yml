config_version: 3.0
datasources:
  spark:
    class_name: Datasource
    execution_engine:
      class_name: SparkDFExecutionEngine
    data_connectors:
      default_runtime_data_connector:
        class_name: RuntimeDataConnector
        batch_identifiers: [run_id]
  postgres:
    class_name: Datasource
    execution_engine:
      class_name: SqlAlchemyExecutionEngine
      connection_string: ${POSTGRES_WAREHOUSE_DSN}
    data_connectors:
      default_runtime_data_connector:
        class_name: RuntimeDataConnector

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend: { class_name: TupleFilesystemStoreBackend, base_directory: gx/expectations }
  validations_store:
    class_name: ValidationsStore
    store_backend: { class_name: TupleFilesystemStoreBackend, base_directory: gx/uncommitted/validations }
  evaluation_parameter_store:
    class_name: EvaluationParameterStore

validation_operators: {}
data_docs_sites:
  local_site:
    class_name: SiteBuilder
    store_backend: { class_name: TupleFilesystemStoreBackend, base_directory: gx/uncommitted/data_docs/local_site }
    site_index_builder: { class_name: DefaultSiteIndexBuilder }
