global:
  resolve_timeout: 5m
route:
  group_by: [severity, table]
  receiver: slack
  routes:
    - match: { severity: critical }
      receiver: slack-critical
    - match: { severity: high }
      receiver: slack
receivers:
  - name: slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#data-alerts"
        title: "{{ .GroupLabels.severity }}: {{ .CommonAnnotations.summary }}"
  - name: slack-critical
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#data-critical"
  - name: email
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
