global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      [{ targets: ['postgres-exporter:9187'] }]
  - job_name: pushgateway
    static_configs:
      [{ targets: ['pushgateway:9091'] }]
  - job_name: airflow
    static_configs:
      [{ targets: ['airflow:8793'] }]
  - job_name: flink
    static_configs:
      [{ targets: ['flink-jobmanager:9249'] }]
  - job_name: cadvisor
    static_configs:
      [{ targets: ['cadvisor:8080'] }]
