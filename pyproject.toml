[project]
name = "streamflix-lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nitin", email = "nitin321x@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "databricks-sdk>=0.139.0",
    "databricks-sql-connector>=4.5.0",
    "delta-spark>=4.4.0",
    "faker>=40.38.0",
    "great-expectations>=1.23.0",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=14.1.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.ruff]
exclude = ["notebooks"]

[tool.ruff.lint]
exclude = ["notebooks"]
ignore = ["DTZ011", "S110", "BLE001"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
