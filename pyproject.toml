[project]
name = "hdfc-bank-lakehouse"
version = "0.1.0"
description = "HDFC Banking Data Platform — MongoDB to Iceberg lakehouse (Architecture.md + PROJECT_PLAN.md Phase 0)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HDFC Bank Platform" }]
dependencies = [
    "python-dotenv>=1.0.0",
    "pyspark>=3.5.0",
    "pyarrow>=15.0.0",
]

[dependency-groups]
ingestion = [
    "pymongo>=4.6.0",
    "pyspark>=3.5.0",
    "pyiceberg>=0.8.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]
transform = [
    "pyspark>=3.5.0",
    "dbt-core>=1.8.0",
    "dbt-databricks>=1.8.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
]
quality = [
    "great-expectations>=0.18.0",
    "pyspark>=3.5.0",
    "jsonschema>=4.21.0",
    "yamale>=6.0.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "yamllint>=1.35.0",
    "mongomock>=4.1.0",
    "faker>=24.0.0",
    "rich>=13.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv", "spark-warehouse", ".spark"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["spark_jobs", "tests", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (requires Spark/Iceberg)",
    "integration: requires docker compose core profile",
]

[tool.yamllint]
extends = "default"
rules.line-length.max = 120

[tool.sqlfluff]
dialect = "postgres"
templater = "raw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
